<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アーティスト管理システム</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; background-color: #f0f8ff; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="text"] { padding: 10px; width: 70%; font-size: 16px; margin-bottom: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; color: white; }
        .btn-blue { background-color: #007BFF; }
        .btn-green { background-color: #06C755; margin-top: 20px; width: 100%; font-size: 20px; padding: 15px; }
        ul { text-align: left; background: #eee; padding: 15px 30px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎸 コントロールパネル</h1>
        
        <h3>1. 監視アーティストの追加</h3>
        <form action="/api/register" method="post">
            <input type="text" name="artist_id" placeholder="SpotifyのアーティストIDを入力" required>
            <button type="submit" class="btn-blue">登録する</button>
        </form>

        <h3>現在の監視リスト</h3>
        <ul>
            {% if artist_names %}
                {% for name in artist_names %}
                    <li>{{ name }}</li>
                {% endfor %}
            {% else %}
                <li>まだ誰も登録されていません。</li>
            {% endif %}
        </ul>
        <hr>
        <h3>2. 新着チェックの実行</h3>
        <form action="/api/check" method="post">
            <button type="submit" class="btn-green">全アーティストの通知チェックを実行</button>
        </form>
    </div>
</body>
</html>
