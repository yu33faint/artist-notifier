<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>処理結果</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f0f8ff; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .message { font-size: 18px; margin: 20px 0; line-height: 1.6; color: #555; }
        .btn-back { display: inline-block; padding: 12px 25px; font-size: 16px; text-decoration: none; background-color: #6c757d; color: white; border-radius: 5px; transition: 0.3s; }
        .btn-back:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <h1>お知らせ</h1>
        
        <div class="message">
            {{ message }}
        </div>

        <a href="/" class="btn-back">ホーム画面に戻る</a>
    </div>
</body>
</html>
